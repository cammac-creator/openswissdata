name: Actualisation TARES contrôlée
on:
  schedule:
    - cron: "0 4 * * 1"
    # Le 1er du mois, date d'effet habituelle des nouveaux taux (6 341 lignes au 01.10.2026) :
    # publier le jour même plutôt qu'au lundi suivant.
    - cron: "10 1 1 * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Préparer et vérifier sans publier"
        type: boolean
        default: true
permissions:
  contents: read
  actions: read
concurrency:
  group: tares-production
  cancel-in-progress: false
jobs:
  refresh-and-publish:
    if: ${{ github.event_name == 'workflow_dispatch' || vars.TARES_CRON_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Choisir le passage
        id: garde
        run: |
          # Un 1er du mois qui tombe un lundi : le passage hebdomadaire publie déjà
          # la version du jour, une seconde serait refusée (aucun écrasement).
          if [ "${{ github.event.schedule }}" = "10 1 1 * *" ] && [ "$(date -u +%u)" = "1" ]; then
            echo "publier=0" >> "$GITHUB_OUTPUT"
            echo "Premier du mois un lundi : la publication revient au passage hebdomadaire." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "publier=1" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.garde.outputs.publier == '1'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - if: steps.garde.outputs.publier == '1'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - if: steps.garde.outputs.publier == '1'
        run: npm ci
      - name: Collecter, contrôler, signer et relire TARES
        if: steps.garde.outputs.publier == '1'
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          BASE_URL: https://www.openswissdata.com
          ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}
          OSD_SIGNING_KEY_ED25519: ${{ secrets.OSD_SIGNING_KEY_ED25519 }}
          TARES_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '0' }}
          SKIP_EMBEDDINGS: "1"
        run: |
          node --import tsx --input-type=module <<'NODE'
          import { runRelease } from './etl/tares/release.ts';
          import { writeFileSync, appendFileSync } from 'node:fs';
          const result = await runRelease();
          const { zip_path, ...summary } = result;
          writeFileSync('data/tares/resultat.json', JSON.stringify(summary, null, 2));
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, `## TARES ${result.version}\n${result.row_count} codes ; archive vérifiée, ${result.registered ? 'version enregistrée' : 'simulation sans publication'}.\nSHA-256 : ${result.sha256}\n\nLes vecteurs de recherche ne font pas partie de cette actualisation.\n`);
          NODE
      - name: Conserver le témoin de résultat
        if: steps.garde.outputs.publier == '1'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: resultat-tares-${{ github.run_id }}
          path: data/tares/resultat.json
          retention-days: 14
          if-no-files-found: error
      - name: Prévenir par mail d'un changement d'état
        if: ${{ !cancelled() && steps.garde.outputs.publier == '1' }}
        env:
          ALERT_CURRENT: ${{ job.status }}
          ALERT_TASK: Publication TARES
          ALERT_WORKFLOW: refresh-tares.yml
          ALERT_DETAIL: La collecte, le contrôle ou la publication TARES n'a pas abouti ; la version vendue reste la précédente.
          # tâche osd.S05 : même mécanisme que FINMA ; TARES n'écrit pas encore de
          # rapport d'arrêt (ses contrôles sont des échecs techniques, pas un choix
          # humain entre options), le texte fixe ci-dessus reste donc le seul repli.
          ALERT_REPORT_FILE: ${{ runner.temp }}/osd-tares-controle.json
          GITHUB_TOKEN: ${{ github.token }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL || 'contact@openswissdata.com' }}
        run: node scripts/alert-email.mjs
