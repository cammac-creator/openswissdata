name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Vérifier les fichiers destinés au dépôt public
        run: node scripts/check-public-repository.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # La compilation utilise les valeurs de développement, sans secret de production.
          NODE_ENV: development

  integrations:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        package: [sdks/mcp-server, sdks/sdk-ts]
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Installer les versions verrouillées
        run: npm ci
      - name: Contrôler les types
        run: npm run typecheck
      - name: Vérifier les échanges et les erreurs
        run: npm test
      - name: Construire la distribution
        run: npm run build
      - name: Vérifier le contenu du paquet sans publication
        run: npm pack --dry-run
      - name: Contrôler les avis de sécurité
        run: npm audit --audit-level=low
