name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Vérifier les fichiers destinés au dépôt public
        run: node scripts/check-public-repository.mjs
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Installer Astro pour les tests des pages publiques
        run: npm --prefix web ci
      - run: npm run typecheck
      - run: npm run test
      - name: Vérifier que les tests n’ont pas modifié les sources
        run: git diff --exit-code

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Poids publics figés : la construction revérifie taille et empreinte de chaque fichier du cache.
      - name: Réutiliser les modèles publics déjà vérifiés
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: dist/models
          key: modeles-${{ hashFiles('src/lib/embedding-model.ts', 'src/lib/translation-model.ts') }}
      - run: npm run build
        env:
          # La compilation utilise les valeurs de développement, sans secret de production.
          NODE_ENV: development

  integrations:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        package: [sdks/mcp-server, sdks/sdk-ts]
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Installer les versions verrouillées
        run: npm ci
      - name: Contrôler les types
        run: npm run typecheck
      - name: Vérifier les échanges et les erreurs
        run: npm test
      - name: Construire la distribution
        run: npm run build
      - name: Vérifier le contenu du paquet sans publication
        run: npm pack --dry-run
      - name: Contrôler les avis de sécurité
        run: npm audit --audit-level=low
