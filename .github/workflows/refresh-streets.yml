name: Collecte mensuelle du répertoire officiel des rues
#
# Sur le modèle exact de `refresh-localities.yml` (tâche osd.localites, tâche B1 du plan
# `2026-10-06-prospection-et-api.md`) : un push fait avec le `GITHUB_TOKEN` par défaut (étape
# « Committer… » ci-dessous) NE déclenche PAS `ci.yml` (règle GitHub : les événements créés
# par `GITHUB_TOKEN` ne relancent pas d'autres workflows). Sans garde propre à CE workflow, un
# commit mensuel partirait donc en production sans être jamais rejoué par la CI. L'étape
# « Vérifier avant de publier » reproduit donc ICI, après la collecte et AVANT tout
# commit/push, le sous-ensemble de `ci.yml` qui couvre ce changement (typecheck + les fichiers
# de test qui exercent `sync-streets.ts`, `getStreets()` et `street_in_municipality`). Un échec
# de cette étape arrête le job AVANT l'étape de commit (steps séquentielles) : aucun commit ne
# part, et l'étape d'alerte mail (`if: !cancelled()`) envoie quand même son message.
on:
  schedule:
    # Le 4 de chaque mois, minute non ronde, un jour après la collecte des localités (le 3) et
    # hors du créneau TARES (le 1er) : laisse chaque collecte mensuelle son propre créneau.
    - cron: "47 6 4 * *"
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: streets-production
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Collecter et contrôler le répertoire officiel des rues (swisstopo)
        run: npm run sync:streets
      - name: Vérifier avant de publier (jamais de commit sans ces contrôles verts)
        run: |
          npm run typecheck
          npx vitest run tests/mcp/company-localities.test.ts tests/mcp/company-streets.test.ts tests/mcp/company-check-tool.test.ts tests/mcp/company-check.test.ts tests/mcp/data-loader-localities.test.ts tests/mcp/data-loader-streets.test.ts tests/scripts/sync-streets.test.ts tests/scripts/build-data-files.test.ts
      - name: Committer les fichiers s'ils ont changé
        run: |
          git config user.name "OpenSwissData"
          git config user.email "actions@users.noreply.github.com"
          git add src/mcp/data/streets.csv.gz src/mcp/data/streets.meta.json
          if ! git diff --cached --quiet; then
            git commit -m "données : actualiser le répertoire officiel des rues (swisstopo)"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Prévenir par mail d'un changement d'état
        if: ${{ !cancelled() }}
        env:
          ALERT_CURRENT: ${{ job.status }}
          ALERT_TASK: Collecte des rues officielles
          ALERT_WORKFLOW: refresh-streets.yml
          ALERT_DETAIL: La collecte ou le contrôle du répertoire officiel des rues (swisstopo) n'a pas abouti ; le fichier servi reste le précédent.
          GITHUB_TOKEN: ${{ github.token }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL || 'contact@openswissdata.com' }}
        run: node scripts/alert-email.mjs
