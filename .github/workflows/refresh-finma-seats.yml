name: Collecte mensuelle du siège exact FINMA (combinaison registre du commerce)
#
# Sur le modèle exact de `refresh-streets.yml` (tâche osd.donnees, tâche B4 du plan
# `2026-10-06-prospection-et-api.md`) : un push fait avec le `GITHUB_TOKEN` par défaut (étape
# « Committer… » ci-dessous) NE déclenche PAS `ci.yml` (règle GitHub : les événements créés par
# `GITHUB_TOKEN` ne relancent pas d'autres workflows). Sans garde propre à CE workflow, un commit
# mensuel partirait donc en production sans être jamais rejoué par la CI. L'étape « Vérifier
# avant de publier » reproduit donc ICI, après la collecte et AVANT tout commit/push, le
# sous-ensemble de `ci.yml` qui couvre ce changement (typecheck + les fichiers de test qui
# exercent `sync-finma-seats.ts`, `getFinmaSeats()` et le profil de commune). Un échec de cette
# étape arrête le job AVANT l'étape de commit (steps séquentielles) : aucun commit ne part, et
# l'étape d'alerte mail (`if: !cancelled()`) envoie quand même son message.
on:
  schedule:
    # Le 5 de chaque mois, minute non ronde, un jour après la collecte des rues (le 4) et hors
    # des créneaux TARES/localités/rues : laisse chaque collecte mensuelle son propre créneau.
    - cron: "33 7 5 * *"
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: finma-seats-production
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Collecter et contrôler le siège exact FINMA (registre du commerce, LINDAS)
        run: npm run sync:finma-seats
      - name: Vérifier avant de publier (jamais de commit sans ces contrôles verts)
        run: |
          npm run typecheck
          npx vitest run tests/scripts/sync-finma-seats.test.ts tests/mcp/data-loader-finma-seats.test.ts tests/lib/commune-profile.test.ts tests/lib/commune-profile-seats.test.ts tests/routes/api-v1.test.ts tests/scripts/build-data-files.test.ts
      - name: Committer les fichiers s'ils ont changé
        run: |
          git config user.name "OpenSwissData"
          git config user.email "actions@users.noreply.github.com"
          git add src/mcp/data/finma_seats.csv src/mcp/data/finma_seats.meta.json
          if ! git diff --cached --quiet; then
            git commit -m "données : actualiser le siège exact FINMA (registre du commerce)"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Prévenir par mail d'un changement d'état
        if: ${{ !cancelled() }}
        env:
          ALERT_CURRENT: ${{ job.status }}
          ALERT_TASK: Collecte du siège exact FINMA
          ALERT_WORKFLOW: refresh-finma-seats.yml
          ALERT_DETAIL: La collecte ou le contrôle du siège exact FINMA (registre du commerce, LINDAS) n'a pas abouti ; le fichier servi reste le précédent.
          GITHUB_TOKEN: ${{ github.token }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL || 'contact@openswissdata.com' }}
        run: node scripts/alert-email.mjs
