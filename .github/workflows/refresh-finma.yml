name: Collecte FINMA quotidienne et contrôle de fraîcheur
on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: finma-production
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    # Secrets réservés à la branche principale (tâche osd.T17, 07.10.2026).
    environment: collecte
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Vérifier si la collecte du jour est déjà publiée
        id: current
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          const response = await fetch('https://www.openswissdata.com/api/health/freshness');
          if (![200,503].includes(response.status)) throw new Error(`HTTP ${response.status}`);
          const data = await response.json();
          const today = new Date().toISOString().slice(0,10).replaceAll('-','.');
          appendFileSync(process.env.GITHUB_OUTPUT, `ready=${data.finma_version === today}\n`);
          NODE
      - name: Collecter, contrôler et publier FINMA
        if: steps.current.outputs.ready != 'true'
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          BASE_URL: https://www.openswissdata.com
          ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}
          OSD_SIGNING_KEY_ED25519: ${{ secrets.OSD_SIGNING_KEY_ED25519 }}
          # tâche osd.S05 : rapport d'arrêt d'un contrôle, fichier temporaire du job,
          # jamais commité ni publié ; lu par l'étape d'alerte ci-dessous (même chemin).
          FINMA_CONTROL_REPORT_FILE: ${{ runner.temp }}/osd-finma-controle.json
        run: npm run etl:finma
      - name: Vérifier la version réellement distribuée
        run: |
          curl --fail --silent --show-error https://www.openswissdata.com/api/health/freshness
          node scripts/record-finma-quality.mjs
      - name: Archiver le témoin public de qualité
        run: |
          git config user.name "OpenSwissData"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data-status/finma.json
          if ! git diff --cached --quiet; then
            git commit -m "données : actualiser le témoin public FINMA"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Prévenir par mail d'un changement d'état
        if: ${{ !cancelled() }}
        env:
          ALERT_CURRENT: ${{ job.status }}
          ALERT_TASK: Collecte FINMA
          ALERT_WORKFLOW: refresh-finma.yml
          ALERT_DETAIL: La collecte, le contrôle ou la publication FINMA n'a pas abouti ; la version distribuée reste la précédente.
          ALERT_REPORT_FILE: ${{ runner.temp }}/osd-finma-controle.json
          GITHUB_TOKEN: ${{ github.token }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL || 'contact@openswissdata.com' }}
        run: node scripts/alert-email.mjs
