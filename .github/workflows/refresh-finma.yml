name: Collecte FINMA quotidienne et contrôle de fraîcheur
on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: finma-production
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Vérifier si la collecte du jour est déjà publiée
        id: current
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          const response = await fetch('https://www.openswissdata.com/api/health/freshness');
          if (![200,503].includes(response.status)) throw new Error(`HTTP ${response.status}`);
          const data = await response.json();
          const today = new Date().toISOString().slice(0,10).replaceAll('-','.');
          appendFileSync(process.env.GITHUB_OUTPUT, `ready=${data.finma_version === today}\n`);
          NODE
      - name: Collecter, contrôler et publier FINMA
        if: steps.current.outputs.ready != 'true'
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          BASE_URL: https://www.openswissdata.com
          ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}
          OSD_SIGNING_KEY_ED25519: ${{ secrets.OSD_SIGNING_KEY_ED25519 }}
        run: npm run etl:finma
      - name: Vérifier la version réellement distribuée
        run: |
          curl --fail --silent --show-error https://www.openswissdata.com/api/health/freshness
          node scripts/record-finma-quality.mjs
      - name: Archiver le témoin public de qualité
        run: |
          git config user.name "OpenSwissData"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data-status/finma.json
          if ! git diff --cached --quiet; then
            git commit -m "données : actualiser le témoin public FINMA"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
