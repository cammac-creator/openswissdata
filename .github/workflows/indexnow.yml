name: Signalement IndexNow
# Chaque lundi, et à la main après une vague de pages : envoie tout le plan du site en ligne à
# IndexNow, pour que Bing et les autres moteurs participants relisent les pages sans attendre.
# Aucun secret : la clé IndexNow est publique et servie à la racine du site.
on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: indexnow
  cancel-in-progress: false
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Envoyer le plan du site
        run: node scripts/indexnow-ping.mjs --sitemap
