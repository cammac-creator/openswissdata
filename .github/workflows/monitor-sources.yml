name: Surveillance quotidienne des sources

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:
    inputs:
      update_baseline:
        description: "Préparer une nouvelle référence à examiner dans les artefacts (ne publie rien)"
        required: false
        default: "false"

permissions:
  contents: read
concurrency:
  group: controle-sources
  cancel-in-progress: false

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Contrôler les sources officielles
        id: canary
        env:
          UPDATE_BASELINE: ${{ inputs.update_baseline }}
        run: |
          if [ "$UPDATE_BASELINE" = "true" ]; then
            node --import tsx scripts/monitor-sources.ts --update
          else
            node --import tsx scripts/monitor-sources.ts
          fi
        continue-on-error: true
      - name: Conserver le rapport et la référence consultée
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: controle-sources-${{ github.run_id }}
          path: |
            etl/canary-report.json
            etl/canary-baseline.json
          retention-days: 14
          if-no-files-found: error
      - name: Résumer le contrôle
        if: always()
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync,existsSync,appendFileSync} from 'node:fs';
          const file='etl/canary-report.json';
          if(!existsSync(file)){
            appendFileSync(process.env.GITHUB_STEP_SUMMARY,'Le contrôle a échoué avant la création du rapport. Consulter les journaux.\n');
            process.exit(1);
          }
          const r=JSON.parse(readFileSync(file,'utf8'));
          const lines=['## Contrôle des sources',`${r.total} sources ; ${r.drift} modifiée(s), ${r.error} erreur(s), ${r.new} sans référence.`,'','Un fichier modifié demande un examen ; ce contrôle ne prouve pas sa qualité métier.',''];
          for(const item of [...r.drifts,...r.errors,...r.new_sources])lines.push(`- ${item.id} : ${item.status}${item.error?' — '+item.error:''}`);
          lines.push('','Aucune issue ni relance client automatique. Le rapport est conservé dans les artefacts pendant 14 jours. Une nouvelle référence proposée doit être examinée avant intégration.');
          appendFileSync(process.env.GITHUB_STEP_SUMMARY,lines.join('\n')+'\n');
          NODE
      - name: Signaler une anomalie dans le résultat de la tâche
        if: always() && steps.canary.outcome != 'success'
        run: |
          echo "::error::Le contrôle des sources demande une vérification. Consulter le rapport et le résumé."
          exit 1
