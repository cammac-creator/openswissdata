name: Contrôle des dépendances

on:
  workflow_dispatch:
  schedule:
    - cron: '35 6 * * 1'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - dossier: .
            nom: application
          - dossier: web
            nom: site
          - dossier: sdks/mcp-server
            nom: mcp
          - dossier: sdks/sdk-ts
            nom: sdk-typescript
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Examiner le graphe verrouillé sans exécuter les dépendances
        working-directory: ${{ matrix.dossier }}
        run: npm audit --audit-level=low --json > npm-audit.json
      - name: Conserver le rapport public de dépendances
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: audit-${{ matrix.nom }}
          path: ${{ matrix.dossier }}/npm-audit.json
          retention-days: 14
          if-no-files-found: error
