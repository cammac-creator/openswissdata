name: Contrôle des dépendances

on:
  workflow_dispatch:
  schedule:
    - cron: '35 6 * * 1'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - dossier: .
            nom: application
          - dossier: web
            nom: site
          - dossier: sdks/mcp-server
            nom: mcp
          - dossier: sdks/sdk-ts
            nom: sdk-typescript
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Examiner le graphe verrouillé sans exécuter les dépendances
        working-directory: ${{ matrix.dossier }}
        run: npm audit --audit-level=low --json > npm-audit.json
      - name: Conserver le rapport public de dépendances
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: audit-${{ matrix.nom }}
          path: ${{ matrix.dossier }}/npm-audit.json
          retention-days: 14
          if-no-files-found: error
