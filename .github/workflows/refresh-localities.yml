name: Collecte mensuelle du répertoire officiel des localités
#
# Relecture finale du 06.10.2026, point 1 : un push fait avec le `GITHUB_TOKEN` par défaut
# (étape « Committer… » ci-dessous) NE déclenche PAS `ci.yml` (règle GitHub : les événements
# créés par `GITHUB_TOKEN` ne relancent pas d'autres workflows, pour éviter les boucles).
# Sans garde propre à CE workflow, un commit mensuel partirait donc en production sans être
# jamais rejoué par la CI. L'étape « Vérifier avant de publier » reproduit donc ICI, après la
# collecte et AVANT tout commit/push, le sous-ensemble de `ci.yml` qui couvre ce changement
# (typecheck + les quatre fichiers de test qui exercent `sync-localities.ts` et les champs
# `address_checks`/`address_checks_edition` qu'il alimente). Un échec de cette étape arrête
# le job AVANT l'étape de commit (comportement par défaut de GitHub Actions, steps
# séquentielles) : aucun commit ne part, et l'étape d'alerte mail (`if: !cancelled()`) envoie
# quand même son message, puisqu'un échec n'est pas une annulation.
on:
  schedule:
    # Le 3 de chaque mois, minute non ronde (décision du 06.10.2026) : laisse passer les
    # collectes du 1er (TARES) et les tâches de début de journée sans partager leur créneau.
    - cron: "41 5 3 * *"
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: localities-production
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Collecter et contrôler le répertoire officiel des localités (swisstopo)
        run: npm run sync:localities
      - name: Vérifier avant de publier (jamais de commit sans ces contrôles verts — point 1)
        run: |
          npm run typecheck
          npx vitest run tests/mcp/company-localities.test.ts tests/mcp/company-check-tool.test.ts tests/mcp/company-check.test.ts tests/scripts/sync-localities.test.ts
      - name: Committer les fichiers s'ils ont changé
        run: |
          git config user.name "OpenSwissData"
          git config user.email "actions@users.noreply.github.com"
          git add src/mcp/data/localities.csv src/mcp/data/localities.meta.json
          if ! git diff --cached --quiet; then
            git commit -m "données : actualiser le répertoire officiel des localités (swisstopo)"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Prévenir par mail d'un changement d'état
        if: ${{ !cancelled() }}
        env:
          ALERT_CURRENT: ${{ job.status }}
          ALERT_TASK: Collecte des localités officielles
          ALERT_WORKFLOW: refresh-localities.yml
          ALERT_DETAIL: La collecte ou le contrôle du répertoire officiel des localités (swisstopo) n'a pas abouti ; le fichier servi reste le précédent.
          GITHUB_TOKEN: ${{ github.token }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL || 'contact@openswissdata.com' }}
        run: node scripts/alert-email.mjs
