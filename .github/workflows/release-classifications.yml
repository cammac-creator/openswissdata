name: Publication des classifications contrôlée
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Préparer et vérifier sans publier"
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: classifications-production
  cancel-in-progress: false
jobs:
  refresh-and-publish:
    runs-on: ubuntu-latest
    # Secrets réservés à la branche principale (tâche osd.T17, 07.10.2026).
    environment: collecte
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Collecter, contrôler, signer et relire CLASSIFICATIONS
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          BASE_URL: https://www.openswissdata.com
          ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}
          OSD_SIGNING_KEY_ED25519: ${{ secrets.OSD_SIGNING_KEY_ED25519 }}
          CLASSIFICATIONS_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '0' }}
          CLASSIFICATIONS_TIER: "standard"
        run: |
          node --import tsx --input-type=module <<'NODE'
          import { runRelease } from './etl/classifications/release.ts';
          import { writeFileSync, appendFileSync } from 'node:fs';
          const result = await runRelease();
          const { zip_path, ...summary } = result;
          writeFileSync('data/classifications/resultat.json', JSON.stringify(summary, null, 2));
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, `## CLASSIFICATIONS ${result.version}\n${result.entity_count} codes ; archive vérifiée, ${result.registered ? 'version enregistrée' : 'simulation sans publication'}.\nSHA-256 : ${result.sha256}\n\nRelations directes par paire ; closeMatch n’est pas une équivalence exacte. Les compléments Pro ne sont pas publiés par cette tâche.\n`);
          NODE
      - name: Conserver le témoin de résultat
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: resultat-classifications-${{ github.run_id }}
          path: data/classifications/resultat.json
          retention-days: 14
          if-no-files-found: error
