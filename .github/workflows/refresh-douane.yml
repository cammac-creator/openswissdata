name: Collecte du commerce extérieur (OFDF)
#
# Décision de Claude-Alain du 05.11.2026. Détail : etl/douane/SOURCES.md.
#
# Ce workflow ne commite rien et ne crée aucun artefact : le document réduit vit dans le bucket R2
# PRIVÉ, un seul objet réécrit. Rien de cette zone dans le dépôt public. Le journal n'affiche que des
# nombres, des dates et des empreintes, dont la durée par étape et la mémoire maximale.
#
# Le déclenchement manuel démarre en simulation (rien d'écrit, aucun secret R2 transmis).
# `accepter_anomalie` ne sert qu'à adopter, après examen, une baisse de volume, une année close qui
# bouge ou une source figée. C'est un passage réel lancé à la main (F6).
on:
  schedule:
    # Un passage par mois, minute non ronde : la source paraît vers le 20 (dernière : 20.10.2026).
    - cron: "47 5 24 * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Simulation : lire la source sans rien écrire dans R2"
        type: boolean
        default: true
      accepter_anomalie:
        description: "Adopter, après examen : baisse de plus de 3 %, année close qui bouge de plus de 1 %, source de plus de 75 jours"
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
concurrency:
  group: douane-production
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    # Secrets réservés à la branche principale (tâche osd.T17, 07.10.2026).
    environment: collecte
    # Mesure sur un Mac le 05.11.2026 : voir SOURCES.md. Marge large : un exécuteur est plus lent, et les
    # reprises du téléchargement attendent jusqu'à 6 minutes par fichier.
    timeout-minutes: 120
    env:
      # Le passage tient avec 2 Go de tas (2,4 Go en tout, SOURCES.md) ; un exécuteur standard a 16 Go.
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Vérifier avant de lire la source (dont le piège des libellés)
        run: |
          npm run typecheck
          npx vitest run tests/etl/douane-parse.test.ts tests/etl/douane-build.test.ts tests/etl/douane-fuite.test.ts tests/etl/douane-download.test.ts tests/etl/sources-registry-douane.test.ts
      - name: Simulation (déclenchement manuel)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: npm run sync:douane
      - name: Collecter, contrôler et écrire le document réduit (R2 privé)
        if: ${{ github.event_name == 'schedule' || !inputs.dry_run }}
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          ACCEPTER_ANOMALIE: ${{ github.event_name == 'workflow_dispatch' && inputs.accepter_anomalie && '--accept-anomaly' || '' }}
        run: npm run sync:douane -- --write-r2 $ACCEPTER_ANOMALIE
      - name: Prévenir par mail d'un changement d'état
        if: ${{ !cancelled() }}
        env:
          ALERT_CURRENT: ${{ job.status }}
          ALERT_TASK: Collecte du commerce extérieur
          ALERT_WORKFLOW: refresh-douane.yml
          ALERT_DETAIL: La collecte du commerce extérieur de l'OFDF n'a pas abouti (installation, contrôles, source, forme du fichier, volume, total loin du repère ou source figée) ; le document précédent reste en place, rien n'est servi à ce jour.
          GITHUB_TOKEN: ${{ github.token }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL || 'contact@openswissdata.com' }}
        run: node scripts/alert-email.mjs
