name: Sauvegarde et restauration SQLite

# Copie de sûreté de l’or créée sur le serveur, chiffrée avant R2 puis relue.
# Réponse brute dans le bronze éphémère du runner ; preuves durables dans le bureau privé.
# Aucun fichier client, clé de sauvegarde ou contenu de base ne transite par GitHub.
on:
  schedule:
    - cron: "15 3 * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
concurrency:
  group: sauvegarde-sqlite
  cancel-in-progress: false

jobs:
  trigger-backup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, version figée
        with:
          persist-credentials: false
          sparse-checkout: scripts/alert-email.mjs
          sparse-checkout-cone-mode: false
      - name: Déclencher et vérifier la restauration isolée de la base
        env:
          ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}
        run: |
          if [ -z "$ADMIN_SECRET" ]; then
            echo "::error::Secret de sauvegarde non configuré"
            exit 1
          fi
          umask 077
          folder="$RUNNER_TEMP/bronze/$(date -u +%F)/backup-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$folder"
          report="$folder/reponse.json"
          auth_header=$(mktemp)
          trap 'rm -f "$auth_header"' EXIT
          printf 'x-admin-secret: %s\n' "$ADMIN_SECRET" > "$auth_header"
          status=$(curl -sS --connect-timeout 10 --max-time 540 -o "$report" -w '%{http_code}' -X POST \
            -H "@$auth_header" -H "content-type: application/json" \
            https://www.openswissdata.com/api/admin/backup-to-r2) || { echo "::error::Serveur de sauvegarde injoignable ou délai dépassé"; exit 1; }
          python3 - "$report" "$status" <<'PYTHON'
          import json,sys
          try:
              with open(sys.argv[1]) as source:
                  data=json.load(source)
          except (OSError,ValueError):
              print('::error::Réponse de sauvegarde illisible ; aucun succès déclaré.')
              sys.exit(1)
          check=data.get('restore_verification') if isinstance(data,dict) else None
          valid=isinstance(check,dict) and check.get('version')==1 and check.get('schema_profile')=='service-crm-2026-09-29' and check.get('byte_match') is True and all(check.get(k)=='ok' for k in ('integrity','foreign_keys','required_schema','current_versions'))
          print('HTTP',sys.argv[2])
          if sys.argv[2]!='200' or not isinstance(data,dict) or data.get('ok') is not True or data.get('encrypted') is not True or data.get('restore_check')!='ok' or data.get('verified_manifest') is not True or data.get('retention_status')!='ok' or not valid:
              print('::error::Sauvegarde ou restauration non vérifiée ; consulter le bureau privé.')
              sys.exit(1)
          print('::notice::Copie chiffrée restaurée ; octets, intégrité, liens, schéma et versions vérifiés. Détail conservé dans le bureau privé.')
          PYTHON
      - name: Prévenir par mail d'un changement d'état
        if: ${{ !cancelled() }}
        env:
          ALERT_CURRENT: ${{ job.status }}
          ALERT_TASK: Sauvegarde de la base
          ALERT_WORKFLOW: backup-db.yml
          ALERT_DETAIL: Sauvegarde ou restauration non vérifiée ; le détail reste dans le bureau privé.
          GITHUB_TOKEN: ${{ github.token }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL || 'contact@openswissdata.com' }}
        run: node scripts/alert-email.mjs
